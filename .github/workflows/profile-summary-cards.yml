# 每天把 GitHub 统计卡片生成为 SVG 文件，提交回本仓库，README 直接引用这些文件。
#
# 为什么这样做：原来 README 里的两张卡片是实时调用 github-readme-stats.vercel.app 生成的，
# 那个公共实例被 Vercel 暂停（HTTP 503 DEPLOYMENT_PAUSED）之后，个人主页的介绍就整块空白了。
# 现在卡片由本仓库的 Actions 自己生成、自己托管，只依赖 GitHub 本身。
#
# 用的 action：vn7n24fzkq/github-profile-summary-cards
# 产出位置：profile-summary-card-output/<主题>/*.svg（默认分支上）
# 升级版本：把下面的 @v0.12.0 换成新 tag，见
#   https://github.com/vn7n24fzkq/github-profile-summary-cards/releases

name: Generate profile summary cards

on:
  schedule:
    # 每天 22:00 UTC = 北京时间次日 06:00。
    # 注意：官方 README 的示例写的是 "* */24 * * *"，那等于 0 点这一小时内每分钟跑一次（60 次/天），
    # 是错的，别照抄。
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # 只在 workflow 文件本身变化时跑一次：这样你第一次提交这个文件就会立刻生成卡片。
    # action 自己产生的提交不会再次触发（GitHub 规定：用 GITHUB_TOKEN 推送不会引发新的 workflow 运行），
    # 所以不会出现「生成 → 提交 → 再生成」的死循环。
    paths:
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write        # action 最后要 git push 卡片，必须给写权限

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - name: 本次使用的令牌
        env:
          HAS_PAT: ${{ secrets.SUMMARY_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "使用 SUMMARY_GITHUB_TOKEN：统计范围包含私有仓库的贡献"
          else
            echo "::warning::没有配置 SUMMARY_GITHUB_TOKEN，本次只统计公开数据。配好 Secret 后手动重跑一次即可。"
          fi

      - uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          # 有 PAT 就用 PAT（能统计私有仓库贡献），没有就退回 GitHub 内置令牌（只有公开数据）。
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # 在 Actions 里 BRANCH_NAME 会被忽略：action 源码里优先用 GITHUB_REF 推导分支，
          # 所以卡片落在「workflow 所在的那个分支」上。这里写上只是为了让本地手动执行时行为一致。
          BRANCH_NAME: "main"
          THEME: github_dark     # 只生成这一个主题；留空会把 60 多个主题全部生成
          UTC_OFFSET: 8          # 北京时间，「高效时段」卡片按这个口径统计
          AUTO_PUSH: true        # 生成后自动 commit + push 回本分支
